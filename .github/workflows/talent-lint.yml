name: Talent lint

on:
  pull_request:
    paths:
      - 'talents/**'
  push:
    branches: [main]
    paths:
      - 'talents/**'
  workflow_dispatch:

jobs:
  talent-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout otenydoo
        uses: actions/checkout@v4
      - name: Checkout the Oteny Talent standard (public peer, talents.git)
        uses: actions/checkout@v4
        with:
          repository: otenycom/talents
          ref: main
          path: talents-standard
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oteny Talent lint (talent-authoring-standard)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t DIRS < <(find talents -mindepth 2 -maxdepth 2 -name SKILL.md -printf '%h\n' | sort -u)
          if [ ${#DIRS[@]} -eq 0 ]; then echo "No Talent bundles to lint."; exit 0; fi
          echo "Linting: ${DIRS[*]}"
          python3 talents-standard/skills/talent-authoring-standard/scripts/lint_upgrade_safe.py "${DIRS[@]}"
          python3 talents-standard/skills/talent-authoring-standard/scripts/lint_tools.py "${DIRS[@]}"
      # The D95 scope-contract coherence pass is not public: it runs Oteny-side at
      # delivery. Before a push that changes a bundle's profile, run it locally with
      # hermeshost's `oteny-talent-lint` from source.
      - name: Talent unit tests and scenarios
        shell: bash
        run: |
          set -euo pipefail
          pip install pytest pyyaml
          mapfile -t UNIT < <(find talents -path '*/tests/unit' -type d | sort)
          if [ ${#UNIT[@]} -gt 0 ]; then
            python3 -m pytest --import-mode=importlib "${UNIT[@]}" -q
          fi
          mapfile -t SCEN < <(find talents -path '*/tests/scenarios/*.yaml' | sort)
          if [ ${#SCEN[@]} -gt 0 ]; then
            python3 talents-standard/skills/_shared/scripts/run_scenario.py --backend mock "${SCEN[@]}"
          fi
