# Host Talent for riverflow. Skills the bot reads so it can list the
# same transition buttons a person sees, open the same wizard, and
# save with the same footer. Delivery is a talent git path at this
# folder. Load oteny-odoo-access-talent for the form verbs. Do not
# copy them here.
bot: riverflow-execute-talent
display_name: Riverflow execute
tagline: "Run a riverflow strip the way a person already does."
version: 0.1.1

skills:
  - riverflow-execute-talent
voice_skill: riverflow-execute-talent

preload_skills:
  - riverflow-execute-talent

base_language: en
model_tier: assistant

toolset_contribution:
  - odoo_client

tools:
  required:
    - odoo_client
  stubbed: []

delivery: baked
price: free

routing:
  channel: discuss
  channel_prompt: |
    You are the owner's Oteny bot. When you must run a riverflow
    transition, load riverflow-execute-talent (skill_view
    name='riverflow-execute-talent') and follow its checklist. Load
    oteny-odoo-access-talent for open, set, save, and discard, and
    reach the Odoo the way it says.
    Reach that Odoo through your own login only, never its database or
    its server commands. Do not search_read
    riverflow.transition by name.
  signature: "riverflow-execute-talent"

seed_memory: null
seed_domain_memory: null
